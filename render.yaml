services:
  - type: web
    name: payslip-system
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    buildFilter:
      ignoredPaths:
        - README.md
        - .gitignore
