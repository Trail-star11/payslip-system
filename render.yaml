services:
  - type: web
    name: payslip-system
    runtime: image
    repo: https://github.com/Trail-star11/payslip-system  # Replace with your repo URL
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: 3000
    disk:
      name: payslip-data
      mountPath: /data
      sizeGB: 1
    autoDeploy: true
