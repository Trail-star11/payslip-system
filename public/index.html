    const userEmpId = $('userEmpId');

    const payslipArea = $('payslipDownloadArea');

    const recordStats = $('recordStats');
    const dummyPasswordDisplay = $('dummyPasswordDisplay');
    const dummyPasswordHint = $('dummyPasswordHint');
    const testModeToggle = $('testModeToggle');
    const testModeStatus = $('testModeStatus');
    const progressContainer = $('progressContainer');
    const progressFill = $('progressFill');
    const progressText = $('progressText');

    const csvFileName = $('csvFileName');
    const pdfFileName = $('pdfFileName');
    const pdfFileList = $('pdfFileList');
    const pdfCount = $('pdfCount');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // ============================================
    // ⭐ FIXED: EXTRACT EMPLOYEE ID - Handles PPRR, TXIX, numeric formats
    // ============================================

    function extractEmpId(text) {
        // PPRR pattern (your most common format)
        const pprrMatch = text.match(/(PPRR[A-Z0-9]+)/i);
        if (pprrMatch) {
            let id = pprrMatch[1].trim().toUpperCase();
            if (id.length >= 4 && id.startsWith('PPRR')) {
                console.log(`✅ Found PPRR ID: ${id}`);
                return id;
            }
        }
        
        // Emp Code with PPRR
        const empCodeMatch = text.match(/Emp Code[:.\s]*(PPRR[A-Z0-9]+)/i);
        if (empCodeMatch) {
            let id = empCodeMatch[1].trim().toUpperCase();
            if (id.length >= 4) {
                console.log(`✅ Found Emp Code: ${id}`);
                return id;
            }
        }
        
        // Employee Code with PPRR
        const employeeCodeMatch = text.match(/Employee Code[:.\s]*(PPRR[A-Z0-9]+)/i);
        if (employeeCodeMatch) {
            let id = employeeCodeMatch[1].trim().toUpperCase();
            if (id.length >= 4) {
                console.log(`✅ Found Employee Code: ${id}`);
                return id;
            }
        }
        
        // Generic PPRR pattern
        const genericMatch = text.match(/\b(PPRR[A-Z0-9]+)\b/i);
        if (genericMatch) {
            let id = genericMatch[1].trim().toUpperCase();
            if (id.length >= 4) {
                console.log(`✅ Found PPRR (generic): ${id}`);
                return id;
            }
        }
        
        // TXIX format (older format)
        const txixMatch = text.match(/(TXIX[A-Z0-9]+)/i);
        if (txixMatch) {
            let id = txixMatch[1].trim().toUpperCase();
            if (id.length >= 4) {
                console.log(`✅ Found TXIX ID: ${id}`);
                return id;
            }
        }
        
        // T1UB format
        const t1ubMatch = text.match(/(T1UB[A-Z0-9]+)/i);
        if (t1ubMatch) {
            let id = t1ubMatch[1].trim().toUpperCase();
            if (id.length >= 4) {
                console.log(`✅ Found T1UB ID: ${id}`);
                return id;
            }
        }
        
        // Numeric-only Emp Code (convert to PPRR)
        const numericMatch = text.match(/Emp Code[:.\s]*([0-9]{4,6})/i);
        if (numericMatch) {
            let num = numericMatch[1].trim();
            if (num.length >= 4 && num.length <= 6) {
                // Check if this numeric ID exists in our data with any prefix
                if (employeeData && employeeData.length > 0) {
                    for (const emp of employeeData) {
                        const empNumeric = emp.empId.toUpperCase().replace(/^[A-Z]+/, '');
                        if (empNumeric === num) {
                            console.log(`✅ Matched numeric ID ${num} to existing employee ${emp.empId}`);
                            return emp.empId.toUpperCase();
                        }
                    }
                }
                console.log(`⚠️ Converting numeric ID ${num} to PPRR${num}`);
                return `PPRR${num}`;
            }
        }
        
        // Fallback
        const fallbackMatch = text.match(/\b([A-Z]{2,4}[0-9]{4,6})\b/);
        if (fallbackMatch) {
            let id = fallbackMatch[1].trim().toUpperCase();
            id = id.replace(/[^A-Z0-9]/g, '');
            if (id.length >= 4 && /[A-Z]/.test(id) && /[0-9]/.test(id)) {
                console.log(`✅ Found fallback ID: ${id}`);
                return id;
            }
        }
        
        console.log(`❌ No ID found in text`);
        return null;
    }

    // ============================================
    // ⭐ FIXED: FIND EMPLOYEE - Matches by numeric part
    // ============================================

    function findEmployee(empId) {
        if (!empId) return null;
        
        empId = empId.toUpperCase().trim();
        
        // Extract numeric part (e.g., "11906" from "PPRR11906" or "TXIX11906")
        const numericPart = empId.replace(/^[A-Z]+/, '');
        
        // 1. Try exact match first
        let found = employeeData.find(e => e.empId.toUpperCase() === empId);
        if (found) return found;
        
        // 2. Try matching by numeric part (TXIX11906 vs PPRR11906)
        found = employeeData.find(e => {
            const eNumeric = e.empId.toUpperCase().replace(/^[A-Z]+/, '');
            return eNumeric === numericPart;
        });
        if (found) {
            console.log(`✅ Matched ${empId} to ${found.empId} by numeric part`);
            return found;
        }
        
        // 3. Try partial match
        found = employeeData.find(e => {
            const eId = e.empId.toUpperCase();
            const eNumeric = eId.replace(/^[A-Z]+/, '');
            return eNumeric.includes(numericPart) || numericPart.includes(eNumeric);
        });
        if (found) {
            console.log(`✅ Matched ${empId} to ${found.empId} by partial match`);
            return found;
        }
        
        return null;
    }

    // ============================================
    // EXTRACT NAME
    // ============================================

    function extractName(text) {
        const patterns = [
            /Name of the Employee[:.\s]*([A-Z\s]+?)(?=\s+No of Days|\s+Emp Code|\s+Aadhaar|\s+Designation|\s+UAN|\s+ESIC|\s+Dated|$)/i,
            /Employee Name[:.\s]*([A-Z\s]+?)(?=\s+No of Days|\s+Emp Code|\s+Aadhaar|\s+Designation|\s+UAN|\s+ESIC|\s+Dated|$)/i,
            /Name[:.\s]*([A-Z\s]+?)(?=\s+No of Days|\s+Emp Code|\s+Aadhaar|\s+Designation|\s+UAN|\s+ESIC|\s+Dated|$)/i,
            /Name\s+([A-Z]{2,}(?:\s+[A-Z]{2,})*)/i,
            /Employee\s+([A-Z]{2,}(?:\s+[A-Z]{2,})*)/i,
        ];
        
        for (const pattern of patterns) {
            const match = text.match(pattern);
            if (match) {
                let name = match[1].trim();
                name = name.replace(/\s+No of Days.*$/i, '')
                           .replace(/\s+Emp Code.*$/i, '')
                           .replace(/\s+Aadhaar.*$/i, '')
                           .replace(/\s+Designation.*$/i, '')
                           .replace(/\s+UAN.*$/i, '')
                           .replace(/\s+ESIC.*$/i, '')
                           .replace(/\s+Dated.*$/i, '')
                           .replace(/\s+Location.*$/i, '')
                           .replace(/\s+Pay-mode.*$/i, '');
                name = name.replace(/[^A-Za-z\s\.]/g, '');
                if (name.length > 1) {
                    return name.trim();
                }
            }
        }
        
        const fallbackMatch = text.match(/([A-Z]{2,}(?:\s+[A-Z]{2,}){1,5})/);
        if (fallbackMatch) {
            let name = fallbackMatch[1].trim();
            const stopWords = ['BASIC', 'HRA', 'ALLOWANCE', 'BONUS', 'LWF', 'UAN', 'ESIC', 'P TAX', 'TOTAL', 'GROSS', 'AMOUNT', 'PARTICULARS', 'EARNING', 'DEDUCTIONS', 'FIXED', 'RATE', 'BANK', 'TRANSFER', 'EXEMPTED', 'LOCATION', 'NOIDA', 'KHASRA', 'NEAR', 'BSES', 'OFFICE', 'VILLAGE', 'POST', 'BHARTHAL', 'DWARKA', 'SECTOR', 'NEW', 'DELHI', 'SUPERVISOR', 'SHIFT', 'INCHARGE', 'TEAM', 'LEADER', 'PICKER', 'LOADER', 'UNLOADER', 'EXECUTIVE'];
            if (stopWords.some(w => name.includes(w))) {
                return null;
            }
            return name;
        }
        
        return null;
    }

    // ============================================
    // API CALLS
    // ============================================

    async function apiCall(endpoint, options = {}) {
        const url = `${API_BASE}${endpoint}`;
        const response = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                ...options.headers
            }
        });
        if (!response.ok) {
            const error = await response.text();
            throw new Error(error || 'API call failed');
        }
        return response.json();
    }

    // ============================================
    // LOAD DATA FROM SERVER
    // ============================================

    async function loadDataFromServer(force = false) {
        if (isRefreshing && !force) return;
        isRefreshing = true;
        
        try {
            console.log('📥 Loading data from server...');
            const data = await apiCall('/data');
            
            if (data && data.employees) {
                employeeData = data.employees;
                
                if (data.pdfs) {
                    pdfDataStore = {};
                    let loadedCount = 0;
                    
                    for (const [filename, pdfData] of Object.entries(data.pdfs)) {
                        if (pdfData.bytes) {
                            try {
                                const binaryString = atob(pdfData.bytes);
                                const bytes = new Uint8Array(binaryString.length);
                                for (let i = 0; i < binaryString.length; i++) {
                                    bytes[i] = binaryString.charCodeAt(i);
                                }
                                pdfDataStore[filename] = {
                                    bytes: bytes.buffer,
                                    pages: pdfData.pages || 0
                                };
                                loadedCount++;
                                console.log(`✅ Loaded PDF: ${filename} (${pdfData.pages || 0} pages)`);
                            } catch(e) {
                                console.error(`❌ Failed to load PDF ${filename}:`, e.message);
                            }
                        }
                    }
                    console.log(`📄 Total PDFs loaded: ${loadedCount}`);
                }
                
                if (!manualTestModeOverride && !isTestModeChanging) {
                    if (data.settings && data.settings.testMode !== undefined) {
                        const serverTestMode = data.settings.testMode;
                        testModeToggle.checked = serverTestMode;
                        lastTestModeState = serverTestMode;
                        updateTestModeStatus();
                    } else {
                        testModeToggle.checked = false;
                        lastTestModeState = false;
                        updateTestModeStatus();
                    }
                }
                
                renderEmployeeList();
                dataLoaded = true;
                
                if (adminUnlocked) {
                    const pdfCount = Object.keys(pdfDataStore).length;
                    setAdminMsg(`✅ Loaded ${employeeData.length} employee records and ${pdfCount} PDFs from server. Test Mode: ${testModeToggle.checked ? 'ON' : 'OFF'}`, 'success');
                }
                return true;
            }
            return false;
        } catch (error) {
            console.error('❌ Error loading data:', error);
            if (adminUnlocked) {
                setAdminMsg('⚠️ Could not connect to server.', 'error');
            }
            return false;
        } finally {
            isRefreshing = false;
        }
    }

    // ============================================
    // SAVE DATA TO SERVER
    // ============================================

    async function saveDataToServer(employees, pdfs = null, settings = null) {
        try {
            console.log('💾 Saving data to server...');
            const data = { employees };
            
            if (pdfs) {
                data.pdfs = {};
                for (const [filename, pdfData] of Object.entries(pdfs)) {
                    try {
                        const bytes = new Uint8Array(pdfData.bytes);
                        let binary = '';
                        for (let i = 0; i < bytes.length; i++) {
                            binary += String.fromCharCode(bytes[i]);
                        }
                        data.pdfs[filename] = {
                            bytes: btoa(binary),
                            pages: pdfData.pages || 0
                        };
                        console.log(`✅ Saved PDF: ${filename} (${pdfData.pages || 0} pages)`);
                    } catch(e) {
                        console.error(`❌ Failed to save PDF ${filename}:`, e);
                    }
                }
            } else if (Object.keys(pdfDataStore).length > 0) {
                data.pdfs = {};
                for (const [filename, pdfData] of Object.entries(pdfDataStore)) {
                    try {
                        const bytes = new Uint8Array(pdfData.bytes);
                        let binary = '';
                        for (let i = 0; i < bytes.length; i++) {
                            binary += String.fromCharCode(bytes[i]);
                        }
                        data.pdfs[filename] = {
                            bytes: btoa(binary),
                            pages: pdfData.pages || 0
                        };
                    } catch(e) {
                        console.error(`❌ Failed to save PDF ${filename}:`, e);
                    }
                }
            }
            
            if (settings) {
                data.settings = settings;
            } else {
                data.settings = { testMode: testModeToggle.checked };
            }
            
            data.lastUpdated = new Date().toISOString();
            
            const result = await apiCall('/data', {
                method: 'POST',
                body: JSON.stringify(data)
            });
            
            const pdfCount = Object.keys(data.pdfs || {}).length;
            console.log(`✅ Data saved: ${data.employees.length} employees, ${pdfCount} PDFs`);
            return true;
        } catch (error) {
            console.error('❌ Error saving data:', error);
            setAdminMsg('⚠️ Could not save data to server.', 'error');
            return false;
        }
    }

    // ============================================
    // AUTO REFRESH
    // ============================================

    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(async () => {
            if (document.hidden) return;
            if (!isTestModeChanging) {
                await loadDataFromServer();
            }
        }, 10000);
    }

    // ============================================
    // ADMIN LOCK
    // ============================================

    function lockAdmin() {
        adminUnlocked = false;
        adminToken = null;
        sessionStorage.removeItem('adminToken');
        adminLockOverlay.classList.remove('hidden');
        adminPasswordInput.value = '';
        adminLockError.textContent = '';
        if (adminTabBtn) {
            adminTabBtn.classList.remove('visible');
        }
        if (adminTabBtn && adminTabBtn.classList.contains('active')) {
            adminTabBtn.classList.remove('active');
            userTabBtn.classList.add('active');
            document.getElementById('tab-admin').classList.remove('active');
            document.getElementById('tab-user').classList.add('active');
        }
        setTimeout(() => adminPasswordInput.focus(), 100);
    }

    async function unlockAdmin() {
        adminUnlocked = true;
        adminLockOverlay.classList.add('hidden');
        if (adminTabBtn) {
            adminTabBtn.classList.add('visible');
        }
        setAdminMsg('🔓 Admin panel unlocked.', 'success');
        if (adminTabBtn) adminTabBtn.click();
        await loadDataFromServer(true);
    }

    function closeAdminLock() {
        adminLockOverlay.classList.add('hidden');
        if (!adminUnlocked && adminTabBtn) {
            adminTabBtn.classList.remove('visible');
        }
    }

    adminLockCloseBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeAdminLock();
    });

    adminLockOverlay.addEventListener('click', function(e) {
        if (e.target === adminLockOverlay) {
            closeAdminLock();
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !adminLockOverlay.classList.contains('hidden')) {
            closeAdminLock();
        }
    });

    // ============================================
    // ADMIN LOGIN
    // ============================================

    adminUnlockBtn.addEventListener('click', async function() {
        const pass = adminPasswordInput.value.trim();
        console.log('🔐 Unlock button clicked');
        console.log('📝 Password length:', pass ? pass.length : 0);
        
        if (!pass) {
            adminLockError.textContent = 'Please enter the admin password.';
            return;
        }
        
        adminLockError.textContent = '⏳ Verifying...';
        adminUnlockBtn.disabled = true;
        adminUnlockBtn.textContent = '⏳ Verifying...';
        
        try {
            console.log('📤 Sending login request...');
            
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: pass })
            });
            
            console.log('📥 Response status:', response.status);
            const result = await response.json();
            console.log('📥 Response data:', result);
            
            adminUnlockBtn.disabled = false;
            adminUnlockBtn.textContent = 'Unlock';
            
            if (result.success) {
                if (result.token) {
                    sessionStorage.setItem('adminToken', result.token);
                }
                adminToken = result.token;
                unlockAdmin();
                adminLockError.textContent = '';
            } else {
                adminLockError.textContent = '❌ ' + (result.message || 'Incorrect password. Try again.');
                adminPasswordInput.value = '';
                adminPasswordInput.focus();
            }
        } catch (error) {
            adminUnlockBtn.disabled = false;
            adminUnlockBtn.textContent = 'Unlock';
            adminLockError.textContent = '❌ Server error: ' + error.message;
            console.error('❌ Unlock error:', error);
        }
    });

    adminPasswordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            adminUnlockBtn.click();
        }
    });

    adminToggleLink.addEventListener('click', function() {
        if (adminUnlocked) {
            if (adminTabBtn) adminTabBtn.click();
        } else {
            adminLockOverlay.classList.remove('hidden');
            setTimeout(() => adminPasswordInput.focus(), 100);
        }
    });

    // ============================================
    // HELPERS
    // ============================================

    function setAdminMsg(msg, type = '') {
        adminStatus.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-triangle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
        adminStatus.className = 'status-box';
        if (type) adminStatus.classList.add(type);
    }

    function setUserMsg(msg, type = '') {
        userStatus.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-triangle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
        userStatus.className = 'status-box';
        if (type) userStatus.classList.add(type);
    }

    function updateTestModeStatus() {
        const isTestModeOn = testModeToggle.checked;
        
        if (isTestModeOn) {
            testModeStatus.textContent = '🔬 ON';
            testModeStatus.className = 'badge badge-test-on';
            if (adminUnlocked) {
                setAdminMsg('🔬 Test Mode ENABLED.', 'warning');
            }
            showDummyPassword();
        } else {
            testModeStatus.textContent = '🔒 OFF';
            testModeStatus.className = 'badge badge-test-off';
            dummyPasswordDisplay.classList.remove('show');
            if (adminUnlocked) {
                setAdminMsg('🔒 Test Mode DISABLED.', '');
            }
        }
    }

    function showDummyPassword() {
        const empId = userEmpId.value.trim();
        
        if (empId) {
            const emp = findEmployee(empId);
            dummyPasswordHint.textContent = emp && emp.empId ? emp.empId : empId;
            dummyPasswordDisplay.classList.add('show');
        } else if (currentUser && currentUser.empId) {
            dummyPasswordHint.textContent = currentUser.empId;
            dummyPasswordDisplay.classList.add('show');
        } else {
            dummyPasswordHint.textContent = 'Enter Employee ID to see your password';
            dummyPasswordDisplay.classList.add('show');
        }
    }

    function formatSize(bytes) {
        if (!bytes) return 'Unknown size';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function getDummyPassword(emp) {
        return emp && emp.empId ? emp.empId : 'dummy123';
    }

    // ============================================
    // RENDER FUNCTIONS
    // ============================================

    function renderEmployeeList() {
        employeeCount.textContent = employeeData.length;
        const withPdf = employeeData.filter(e => e.pageNumber && e.pdfFile && pdfDataStore[e.pdfFile]).length;
        const withPass = employeeData.filter(e => e.password && e.password.length > 0).length;
        recordStats.textContent = `📊 ${withPdf} with PDF | ${withPass} with password`;

        if (employeeData.length === 0) {
            employeeList.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 1rem;">No employees uploaded yet</p>';
            return;
        }

        let html = `<table class="employee-table"><thead><tr><th>Emp ID</th><th>Name</th><th>PDF Found</th><th>Password</th></tr></thead><tbody>`;
        employeeData.forEach(emp => {
            const hasPdf = emp.pageNumber && emp.pdfFile && pdfDataStore[emp.pdfFile];
            const pdfStatus = hasPdf ? 
                `<span class="badge badge-page">✅ Page ${emp.pageNumber} (${emp.pdfFile})</span>` : 
                emp.pageNumber ? `<span class="badge badge-not-found">⚠️ PDF not loaded</span>` :
                `<span class="badge badge-not-found">❌ Not found</span>`;
            const passStatus = emp.password && emp.password.length > 0 ? 
                `<span class="badge badge-pass-yes">✅ Available</span>` : 
                `<span class="badge badge-pass-no">❌ Not set</span>`;
            html += `<tr><td><strong>${emp.empId}</strong></td><td>${emp.name || 'N/A'}</td><td>${pdfStatus}</td><td>${passStatus}</td></tr>`;
        });
        html += '</tbody></table>';
        employeeList.innerHTML = html;
    }

    function updatePdfFileList() {
        if (pdfFiles.length === 0) {
            pdfFileList.innerHTML = '';
            pdfCount.textContent = '0';
            pdfFileName.textContent = '';
            pdfUploadBox.classList.remove('has-file');
            return;
        }
        pdfCount.textContent = pdfFiles.length;
        pdfFileName.textContent = `📄 ${pdfFiles.length} PDF(s) selected`;
        pdfUploadBox.classList.add('has-file');

        let html = '';
        pdfFiles.forEach((file, index) => {
            html += `<div class="file-list-item"><span>${file.name} (${formatSize(file.size)})</span><button class="remove-file" data-index="${index}">✕</button></div>`;
        });
        pdfFileList.innerHTML = html;

        document.querySelectorAll('.remove-file').forEach(btn => {
            btn.addEventListener('click', function() {
                const index = parseInt(this.dataset.index);
                pdfFiles.splice(index, 1);
                updatePdfFileList();
                $('pdfFileInput').value = '';
            });
        });
    }

    // ============================================
    // EXTRACT PAGE FROM PDF
    // ============================================

    async function extractPageFromPdf(filename, pageNumber) {
        const pdfData = pdfDataStore[filename];
        if (!pdfData) {
            throw new Error(`PDF '${filename}' not found. Please re-upload.`);
        }
        try {
            const pdfDoc = await PDFLib.PDFDocument.load(pdfData.bytes);
            const newPdfDoc = await PDFLib.PDFDocument.create();
            const [copiedPage] = await newPdfDoc.copyPages(pdfDoc, [pageNumber - 1]);
            newPdfDoc.addPage(copiedPage);
            return await newPdfDoc.save();
        } catch(err) {
            throw new Error('Could not extract page: ' + err.message);
        }
    }

    // ============================================
    // PROCESS DATA
    // ============================================

    $('processDataBtn').addEventListener('click', async function() {
        if (!adminUnlocked) { lockAdmin(); return; }
        if (!csvData && pdfFiles.length === 0) {
            setAdminMsg('Please upload a CSV file or at least one PDF file.', 'error');
            return;
        }

        progressContainer.style.display = 'block';
        progressFill.style.width = '0%';
        progressPercent.textContent = '0%';
        progressText.textContent = 'Starting...';

        try {
            let csvEmployees = [];
            if (csvData) {
                progressText.textContent = 'Reading CSV...';
                const csvText = await csvData.text();
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                if (lines.length > 1) {
                    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                    const empIdx = headers.indexOf('empid');
                    const nameIdx = headers.indexOf('name');
                    const passIdx = headers.indexOf('password');
                    if (empIdx !== -1 && nameIdx !== -1) {
                        for (let i = 1; i < lines.length; i++) {
                            const cols = lines[i].split(',').map(c => c.trim());
                            if (cols.length > Math.max(empIdx, nameIdx)) {
                                csvEmployees.push({
                                    empId: cols[empIdx].trim(),
                                    name: cols[nameIdx].trim(),
                                    password: passIdx !== -1 && cols.length > passIdx ? cols[passIdx].trim() : ''
                                });
                            }
                        }
                    } else {
                        setAdminMsg('CSV must have empId, name, password columns.', 'error');
                        progressContainer.style.display = 'none';
                        return;
                    }
                }
                progressFill.style.width = '10%';
                progressPercent.textContent = '10%';
            }

            let allPdfEmployees = [];
            let totalPages = 0;
            let processedPages = 0;

            if (pdfFiles.length > 0) {
                progressText.textContent = `Processing ${pdfFiles.length} PDF(s)...`;
                for (let p = 0; p < pdfFiles.length; p++) {
                    const pdfFile = pdfFiles[p];
                    progressText.textContent = `Loading PDF ${p + 1}/${pdfFiles.length}: ${pdfFile.name}...`;
                    
                    const arrayBuffer = await pdfFile.arrayBuffer();
                    const pdfBytes = new Uint8Array(arrayBuffer);
                    
                    pdfDataStore[pdfFile.name] = { 
                        bytes: pdfBytes.buffer, 
                        pages: 0 
                    };

                    const pdf = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
                    const pageCount = pdf.numPages;
                    pdfDataStore[pdfFile.name].pages = pageCount;
                    totalPages += pageCount;

                    progressText.textContent = `Scanning ${pdfFile.name} (${pageCount} pages)...`;
                    for (let i = 1; i <= pageCount; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        
                        // Use the updated extractEmpId function
                        const empId = extractEmpId(pageText);
                        
                        if (empId) {
                            const name = extractName(pageText) || `Employee ${i}`;
                            allPdfEmployees.push({
                                empId: empId,
                                name: name,
                                pageNumber: i,
                                pdfFile: pdfFile.name
                            });
                            console.log(`✅ Found Employee ID: ${empId} on page ${i} of ${pdfFile.name}`);
                        }
                        processedPages++;
                        const progress = 10 + (processedPages / (totalPages || 1)) * 70;
                        progressFill.style.width = Math.min(progress, 80) + '%';
                        progressPercent.textContent = Math.round(Math.min(progress, 80)) + '%';
                        progressText.textContent = `Scanning ${pdfFile.name} - Page ${i}/${pageCount}...`;
                    }
                }
            }

            progressText.textContent = 'Merging data...';
            progressFill.style.width = '85%';
            progressPercent.textContent = '85%';

            let mergedData = [];
            if (csvEmployees.length > 0) {
                mergedData = csvEmployees.map(emp => {
                    // Find matching employee by numeric part
                    const empNumeric = emp.empId.toUpperCase().replace(/^[A-Z]+/, '');
                    const pdfMatch = allPdfEmployees.find(p => {
                        const pNumeric = p.empId.toUpperCase().replace(/^[A-Z]+/, '');
                        return pNumeric === empNumeric;
                    });
                    return {
                        empId: emp.empId,
                        name: emp.name || (pdfMatch ? pdfMatch.name : ''),
                        password: emp.password || '',
                        pageNumber: pdfMatch ? pdfMatch.pageNumber : null,
                        pdfFile: pdfMatch ? pdfMatch.pdfFile : null
                    };
                });
                
                // Add PDF-only employees that weren't in CSV
                allPdfEmployees.forEach(pdfEmp => {
                    const exists = mergedData.some(m => {
                        const mNumeric = m.empId.toUpperCase().replace(/^[A-Z]+/, '');
                        const pNumeric = pdfEmp.empId.toUpperCase().replace(/^[A-Z]+/, '');
                        return mNumeric === pNumeric;
                    });
                    if (!exists) {
                        mergedData.push({
                            empId: pdfEmp.empId,
                            name: pdfEmp.name,
                            password: '',
                            pageNumber: pdfEmp.pageNumber,
                            pdfFile: pdfEmp.pdfFile
                        });
                    }
                });
            } else {
                mergedData = allPdfEmployees.map(e => ({ ...e, password: '' }));
            }

            employeeData = mergedData;
            
            const currentTestMode = testModeToggle.checked;
            const saved = await saveDataToServer(employeeData, pdfDataStore, { testMode: currentTestMode });
            if (!saved) {
                setAdminMsg('❌ Failed to save data to server.', 'error');
                progressContainer.style.display = 'none';
                return;
            }

            pdfFiles = [];
            csvData = null;
            csvFileName.textContent = '';
            updatePdfFileList();
            csvUploadBox.classList.remove('has-file');

            progressFill.style.width = '100%';
            progressPercent.textContent = '100%';
            progressText.textContent = '✅ Complete!';
            
            const pdfCount = Object.keys(pdfDataStore).length;
            setAdminMsg(`✅ Successfully processed ${employeeData.length} employees with ${pdfCount} PDF(s). Test Mode: ${currentTestMode ? 'ON' : 'OFF'}`, 'success');

            setTimeout(() => { progressContainer.style.display = 'none'; }, 2000);
            renderEmployeeList();

        } catch(err) {
            console.error('❌ Error processing:', err);
            setAdminMsg('❌ Error processing: ' + err.message, 'error');
            progressContainer.style.display = 'none';
        }
    });

    $('csvFileInput').addEventListener('change', function(e) {

        const file = e.target.files[0];

            csvFileName.textContent = '📄 ' + file.name;

    $('pdfFileInput').addEventListener('change', function(e) {
        if (!adminUnlocked) { lockAdmin(); return; }
        const files = e.target.files;
        if (files.length > 0) {
            for (const file of files) {
                if (file.type === 'application/pdf') {
                    if (!pdfFiles.find(f => f.name === file.name && f.size === file.size)) {
                        pdfFiles.push(file);
                    }
                }
            }
            updatePdfFileList();
        }
    });

    // ============================================
    // TEST MODE SYNC
    // ============================================

    let testModeSyncInterval = null;
    let lastTestModeState = false;

    async function syncTestModeFromServer() {
        try {
            const response = await fetch('/api/data');
            const data = await response.json();
            
            if (data && data.settings && data.settings.testMode !== undefined) {
                const serverTestMode = data.settings.testMode;
                
                if (serverTestMode !== lastTestModeState) {
                    console.log(`🔄 Test mode changed on server: ${serverTestMode ? 'ON' : 'OFF'}`);
                    lastTestModeState = serverTestMode;
                    
                    const wasChanging = isTestModeChanging;
                    isTestModeChanging = true;
                    
                    testModeToggle.checked = serverTestMode;
                    updateTestModeStatus();
                    
                    if (adminUnlocked) {
                        setAdminMsg(`🔬 Test Mode ${serverTestMode ? 'ENABLED' : 'DISABLED'} (Updated from server)`, 
                                   serverTestMode ? 'warning' : '');
                    } else {
                        setUserMsg(`🔬 Test Mode ${serverTestMode ? 'ENABLED' : 'DISABLED'} by Admin`, 
                                   serverTestMode ? 'warning' : '');
                    }
                    
                    payslipArea.classList.remove('show');
                    if (!serverTestMode) {
                        dummyPasswordDisplay.classList.remove('show');
                    }
                    
                    isTestModeChanging = wasChanging;
                }
                
                lastTestModeState = serverTestMode;
            }
        } catch (error) {
            console.log('⚠️ Test mode sync failed:', error.message);
        }
    }

    function startTestModeSync() {
        if (testModeSyncInterval) {
            clearInterval(testModeSyncInterval);
        }
        
        testModeSyncInterval = setInterval(() => {
            if (!isTestModeChanging && !document.hidden) {
                syncTestModeFromServer();
            }
        }, 3000);
    }

    function stopTestModeSync() {
        if (testModeSyncInterval) {
            clearInterval(testModeSyncInterval);
            testModeSyncInterval = null;
        }
    }

    // ============================================
    // TEST MODE TOGGLE
    // ============================================

    testModeToggle.addEventListener('change', function() {
        if (!adminUnlocked) { 
            lockAdmin(); 
            return; 
        }
        
        isTestModeChanging = true;
        manualTestModeOverride = true;
        
        const newState = testModeToggle.checked;
        lastTestModeState = newState;
        
        updateTestModeStatus();
        payslipArea.classList.remove('show');
        
        if (newState) {
            showDummyPassword();
            setAdminMsg(`🔬 Test Mode ENABLED - Available on all devices now`, 'warning');
        } else {
            dummyPasswordDisplay.classList.remove('show');
            setAdminMsg(`🔒 Test Mode DISABLED - Available on all devices now`, '');
        }
        
        saveDataToServer(employeeData, null, { testMode: newState });
        
        setTimeout(() => {
            isTestModeChanging = false;
            syncTestModeFromServer();
        }, 1000);
    });

    // ============================================
    // USER LOGIN
    // ============================================

    $('loginWithPasswordBtn').addEventListener('click', async function() {
        await loadDataFromServer(true);
        
        const empId = userEmpId.value.trim();
        const password = userPassword.value.trim();
        if (!empId) { setUserMsg('Please enter Employee ID.', 'error'); return; }
        if (!password) { setUserMsg('Please enter your password.', 'error'); return; }

        // Use the updated findEmployee function
        const emp = findEmployee(empId);
        if (!emp) { setUserMsg(`❌ No employee found with ID: ${empId}`, 'error'); return; }

        let passOk = false;
        let loginMessage = '';
        
        if (testModeToggle.checked) {
            const dummyPass = getDummyPassword(emp);
            if (password === emp.password || password === dummyPass) {
                passOk = true;
                if (password === dummyPass) {
                    loginMessage = `🔬 Test Mode: Logged in with Employee ID as password`;
                }
            }
        } else {
            passOk = (password === emp.password);
        }

        if (!passOk) {
            setUserMsg('❌ Incorrect password. Please try again.', 'error');
            return;
        }

        currentUser = emp;
        if (loginMessage) {
            setUserMsg(loginMessage, 'warning');
        } else {
            setUserMsg(`✅ Login successful! Welcome ${emp.name || emp.empId}.`, 'success');
        }
        await showPayslip(emp);
        
        if (testModeToggle.checked) {
            showDummyPassword();
        }
    });

    // ============================================
    // SHOW PAYSLIP
    // ============================================

    async function showPayslip(user) {
        if (!user) { setUserMsg('No user data available.', 'error'); return; }

        payslipEmpName.textContent = user.name || user.empId;
        payslipEmpIdSpan.textContent = user.empId;

        if (user.pageNumber && user.pdfFile) {
            const pdfAvailable = pdfDataStore[user.pdfFile];
            if (!pdfAvailable) {
                setUserMsg(`⚠️ PDF '${user.pdfFile}' not found. Please contact admin to re-upload.`, 'error');
                payslipArea.classList.remove('show');
                return;
            }
            
            try {
                setUserMsg('⏳ Extracting your payslip...');
                const pdfBytes = await extractPageFromPdf(user.pdfFile, user.pageNumber);
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                
                if (payslipArea.dataset.pdfBlobUrl) {
                    URL.revokeObjectURL(payslipArea.dataset.pdfBlobUrl);
                }
                
                payslipArea.dataset.pdfBlobUrl = URL.createObjectURL(blob);
                payslipArea.dataset.pdfName = `payslip_${user.empId}.pdf`;
                payslipFileSize.textContent = formatSize(pdfBytes.length);
                payslipArea.classList.add('show');
                setUserMsg('✅ Payslip ready for download!', 'success');
            } catch(err) {
                setUserMsg('⚠️ Could not extract payslip: ' + err.message, 'error');
                payslipArea.classList.remove('show');
            }
        } else if (user.pageNumber) {
            setUserMsg('⚠️ PDF file reference found but no data. Please contact admin.', 'error');
            payslipArea.classList.remove('show');
        } else {
            setUserMsg('⚠️ No payslip found for this employee.', 'error');
            payslipArea.classList.remove('show');
        }
    }

    // ============================================
    // TAB SWITCHING
    // ============================================

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if (this.dataset.tab === 'tab-admin' && !adminUnlocked) {
                lockAdmin();
                return;
            }
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const panelId = this.dataset.tab;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
        });
    });

    // ============================================
    // INIT
    // ============================================

    async function init() {
        adminUnlocked = false;
        adminLockOverlay.classList.add('hidden');
        if (adminTabBtn) adminTabBtn.classList.remove('visible');
        adminToggleLink.style.display = 'flex';

        if (adminToken) {
            const isValid = await verifyAdminToken();
            if (isValid) {
                adminUnlocked = true;
                if (adminTabBtn) adminTabBtn.classList.add('visible');
                console.log('🔓 Admin token restored from session');
            } else {
                sessionStorage.removeItem('adminToken');
                adminToken = null;
            }
        }

        await loadDataFromServer(true);
        
        lastTestModeState = testModeToggle.checked;
        
        if (!testModeToggle.checked) {
            testModeToggle.checked = false;
            updateTestModeStatus();
        }
        
        setAdminMsg(`📦 ${employeeData.length} employee records, ${Object.keys(pdfDataStore).length} PDFs loaded.`, '');
        setUserMsg('Enter Employee ID and password to download payslip.');
        
        startAutoRefresh();
        startTestModeSync();
        
        console.log('📄 Multi-device payslip system running.');
        console.log(`📊 ${employeeData.length} employees`);
        console.log(`📄 ${Object.keys(pdfDataStore).length} PDFs`);
        console.log(`🔒 Test Mode: ${testModeToggle.checked ? 'ON' : 'OFF'}`);
        console.log(`🔄 Test Mode Sync: Enabled (checks every 3 seconds)`);
        console.log('🔐 Admin auth: Server-side (secure)');
        console.log('🔑 Admin password is NOT in the code!');
        
        // ⭐ FIXED: Also sync test mode on visibility change
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                syncTestModeFromServer();
            }
        });
    }

    userTabBtn.classList.add('active');
    document.getElementById('tab-user').classList.add('active');
    document.getElementById('tab-admin').classList.remove('active');

    init();
})();
